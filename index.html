<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07070a" />
    <meta name="description" content="DatePlanner — weather-aware, location-aware date planning." />
    <title>DatePlanner — Plan the perfect date</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
  (() => {
    const originalError = console.error.bind(console);

    console.error = (...args) => {
      originalError(...args);

      const error =
        args.find(value => value instanceof Error) ||
        args.find(value => value && value.stack);

      if (!error) return;

      const root = document.getElementById('root');

      if (root && !root.dataset.runtimeError) {
        root.dataset.runtimeError = '1';

        const pre = document.createElement('pre');
        pre.style.cssText =
          'box-sizing:border-box;min-height:100vh;margin:0;padding:24px;background:#060609;color:#ff8080;white-space:pre-wrap;font:14px/1.55 monospace';
        pre.textContent = error.stack || String(error);

        root.replaceChildren(pre);
      }
    };
  })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
